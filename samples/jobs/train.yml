$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: tutorial-cpu-training
code: ../src
command: >-
  python tutorial_job.py train
  --data ${{inputs.training_data}}
  --model-output ${{outputs.model_output}}
  --checkpoint-output ${{outputs.checkpoint_output}}
inputs:
  training_data:
    type: uri_file
    path: ../data/training.json
    mode: ro_mount
outputs:
  model_output:
    type: uri_folder
    mode: rw_mount
  checkpoint_output:
    type: uri_folder
    mode: rw_mount
compute: azureml:YOUR_KUBERNETES_COMPUTE
resources:
  instance_type: YOUR_CPU_INSTANCE_TYPE
  instance_count: 1
environment: azureml:YOUR_CPU_ENVIRONMENT:1
limits:
  timeout: 300
